name: Rename face files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename prefixed face files
        run: |
          cd poll-tracker-app/public/faces
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv -f 1-beyahad-11.png beyahad-11.png
          git mv -f 2-beyahad-13.png beyahad-13.png
          git mv -f 3-joint-list-04.png joint-list-04.png
          git mv -f 4-noam-leisrael-03.png noam-leisrael-03.png
          git mv -f 5-noam-leisrael-04.png noam-leisrael-04.png
          git mv -f 6-otzma-yehudit-07.png otzma-yehudit-07.png
          git mv -f 7-otzma-yehudit-10.png otzma-yehudit-10.png
          git mv -f 8-religious-zionism-06.png religious-zionism-06.png
          git mv -f 9-religious-zionism-09.png religious-zionism-09.png
          git mv -f 10-utj-06.png utj-06.png
          git mv -f 11-yashar-10.png yashar-10.png
          git mv -f 12-yashar-11.png yashar-11.png
          git mv -f 13-yashar-14.png yashar-14.png
          git mv -f 14-yashar-16.png yashar-16.png
          git mv -f 15-yashar-20.png yashar-20.png
          git mv -f 16-yashar-21.png yashar-21.png
          git mv -f 17-yashar-23.png yashar-23.png
          git mv -f 18-yisrael-beiteinu-03.png yisrael-beiteinu-03.png
          git mv -f 19-yisrael-beiteinu-09.png yisrael-beiteinu-09.png
          git mv -f 20-yisrael-beiteinu-12.png yisrael-beiteinu-12.png
          git commit -m "Rename face files to final names"
          git push
