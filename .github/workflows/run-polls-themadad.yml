# Self-hosted runner: fetch themadad from YOUR network (avoids GitHub datacenter 403).
#
# Setup (once):
#   1. Repo → Settings → Actions → Runners → New self-hosted runner → Linux (or macOS) x64.
#   2. On the machine (must stay online near run times): follow the download + config.sh commands.
#   3. Start the runner: ./run.sh (or install as a service — see GitHub docs).
#
# Secrets: GOOGLE_SERVICE_ACCOUNT_JSON (required). HTTPS_PROXY (optional).
#
# Schedule (Asia/Jerusalem — gate in scripts/israel-poll-schedule-gate.mjs):
#   • Wed & Thu: 09:00, 14:00, 21:00
#   • Fri: 09:30, 10:30, 11:30
#   Cron lists IDT/IST UTC pairs; the gate keeps only the matching IL wall-clock slot.
#
# Fingerprint: committed `.themadad-fingerprint` (v2: maxId:rows:hash) is the source of truth.
# cancel-in-progress: false — let the in-flight sync finish; queued runs wait on the single
# self-hosted runner instead of killing a slow/hung job (which caused multi-hour upload gaps).
#
# To always upload now (no fingerprint, no git commit): use workflow "Run polls now".

name: Run polls when themadad updates

on:
  schedule:
    # Wed & Thu — 09:00, 14:00, 21:00 IL (IDT/IST UTC pairs)
    - cron: '0 6,7,11,12,18,19 * * 3,4'
    # Fri — 09:30, 10:30, 11:30 IL (IDT/IST UTC pairs)
    - cron: '30 6,7,8,9 * * 5'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Always upload (skip fingerprint) — use to verify fetch + Sheets'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: themadad-poll-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify Israel schedule slot
        id: slot
        if: github.event_name == 'schedule'
        run: |
          if node scripts/israel-poll-schedule-gate.mjs wed-thu || node scripts/israel-poll-schedule-gate.mjs fri-poll; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.slot.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-polls.txt

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.slot.outputs.ok == 'true'
        run: pip install -r requirements-polls.txt

      - name: Detect new polls on themadad.com (or force)
        if: github.event_name != 'schedule' || steps.slot.outputs.ok == 'true'
        id: check
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_upload }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual force_upload — skipping fingerprint check."
            exit 0
          fi
          python check_themadad.py

      - name: Require GOOGLE_SERVICE_ACCOUNT_JSON
        if: (github.event_name != 'schedule' || steps.slot.outputs.ok == 'true') && steps.check.outputs.changed == 'true'
        env:
          CREDS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$CREDS" ]; then
            echo "::error::Add repository secret GOOGLE_SERVICE_ACCOUNT_JSON (service account JSON with Sheets edit access)."
            exit 1
          fi

      - name: Fetch, transform, upload to Sheets
        if: (github.event_name != 'schedule' || steps.slot.outputs.ok == 'true') && steps.check.outputs.changed == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python run_polls.py

      - name: Commit sync fingerprint after successful upload
        if: (github.event_name != 'schedule' || steps.slot.outputs.ok == 'true') && success() && steps.check.outputs.changed == 'true'
        run: |
          if [ ! -f .themadad-fingerprint ]; then
            echo "::error::Missing .themadad-fingerprint after upload."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .themadad-fingerprint
          git diff --staged --quiet && echo "Fingerprint unchanged in git — skip commit." && exit 0
          git commit -m "chore: update themadad sync fingerprint [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
