          count=0
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -sfL --retry 3 -o "poll-tracker-app/public/faces/$name" "$url"
            count=$((count+1))
          done < /tmp/manifest.txt
          echo "downloaded $count files"
          find poll-tracker-app/public/faces -name '*.png' | wc -l

      - name: Verify PNGs
        run: |
          set -euo pipefail
          bad=0
          for f in poll-tracker-app/public/faces/*.png; do
            head -c8 "$f" | grep -q $'\211PNG' || { echo "BAD: $f"; bad=1; }
          done
          [ "$bad" -eq 0 ]

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poll-tracker-app/public/faces
          git commit -m "Add candidate face cutouts under public/faces (migrated from Cloudinary)"
          git push

